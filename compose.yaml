name: sus-quotient

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: susq
      POSTGRES_DB: susq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
      # timescaledb-tune otherwise sizes Postgres for the whole host.
      TS_TUNE_MEMORY: 4GB
      TS_TUNE_NUM_CPUS: "4"
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susq -d susq"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  collector:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://susq:${POSTGRES_PASSWORD}@db:5432/susq?sslmode=disable
      SEED_LOGINS: ${SEED_LOGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18090:8080"
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    entrypoint: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: postgres://susq:${POSTGRES_PASSWORD}@db:5432/susq?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    # LAN and loopback only; not published through the edge.
    ports:
      - "127.0.0.1:18091:8081"
      - "10.0.0.50:18091:8081"
    restart: unless-stopped
    logging: *logging

  # Nightly logical dump into ./backups, keeping 7 days. Same host as the
  # database, so this protects against bad migrations, not disk loss.
  backup:
    image: timescale/timescaledb:latest-pg17
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/susq-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup written: $$f"
          else
            rm -f "$$f.tmp"; echo "backup failed" >&2
          fi
          find /backups -name 'susq-*.dump' -mtime +7 -delete
          sleep 86400
        done
    environment:
      PGHOST: db
      PGUSER: susq
      PGDATABASE: susq
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  db:
