<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headcount</title>
  <meta name="description" content="Viewbot, follow-bot and chat-bot signals for the top 200 Twitch channels.">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="preload" href="/brand/fonts/Public-Sans-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/brand/fonts/Barlow-Condensed-1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="viz-root">
    <header class="top">
      <a class="brand" href="#/" aria-label="Headcount, leaderboard">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect class="ink" x="4" y="3.5" width="2.6" height="17" rx="1.3"/>
          <rect class="ink" x="8.4" y="3.5" width="2.6" height="17" rx="1.3"/>
          <rect class="hollow" x="13.4" y="4.1" width="1.4" height="15.8" rx="0.7"/>
          <rect class="hollow" x="17.8" y="4.1" width="1.4" height="15.8" rx="0.7"/>
          <path class="slash" d="M2 17.2 L22 7.6"/>
        </svg>
        <span class="word">Headcount</span>
      </a>
      <nav>
        <a href="#/">Leaderboard</a>
        <a href="#/live">Live now</a>
        <a href="#/engagement">Engagement map</a>
        <a href="#/about">How scoring works</a>
      </nav>
      <form class="search" id="search" role="search" autocomplete="off">
        <input type="search" id="search-q" name="q" maxlength="50" placeholder="Search channels and categories"
          aria-label="Search channels and categories" aria-controls="search-suggest" aria-expanded="false">
        <div class="suggest" id="search-suggest" hidden></div>
      </form>
    </header>
    <main id="app" aria-live="polite"></main>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
