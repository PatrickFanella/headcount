<!doctype html>
<html lang="en">
<head>

  <title>sus quotient</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="viz-root">
    <header class="top">
      <a class="brand" href="#/">sus<span>quotient</span></a>
      <nav>

        <a href="#/live">Live now</a>
